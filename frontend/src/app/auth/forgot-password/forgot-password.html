<div class="auth-page">
  <div class="auth-container">
    @if (submitted()) {
      <div class="verify-notice">
        <span class="verify-notice__icon">📧</span>
        <h2>Check your email</h2>
        <p class="subtitle">If an account exists with that email, we've sent a password reset link.</p>
        <a routerLink="/login" class="btn btn--primary">Back to Login</a>
      </div>
    } @else {
      <h2>Forgot your password?</h2>
      <p class="subtitle">Enter your email and we'll send you a reset link.</p>

      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="field">
          <input type="email" formControlName="email" placeholder=" " id="email" />
          <label for="email">Email</label>
        </div>

        @if (errorMessage()) {
          <p class="error-message">{{ errorMessage() }}</p>
        }

        <button type="submit" [disabled]="form.invalid">Send Reset Link</button>
      </form>

      <p class="footer-link">Remembered it? <a routerLink="/login">Login</a></p>
    }
  </div>
</div>
